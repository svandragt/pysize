<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pysize — find the cost of PyPI packages</title>
<style>
  :root { --bg:#0e1116; --card:#161b22; --line:#2a313c; --fg:#e6edf3; --muted:#8b949e; --accent:#ffb454; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  .wrap { max-width:760px; margin:0 auto; padding:48px 20px 80px; }
  h1 { font-size:30px; margin:0 0 4px; }
  h1 .py { color:var(--accent); }
  h1 a { color:inherit; text-decoration:none; }
  p.sub { color:var(--muted); margin:0 0 28px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:13px 15px; font-size:16px; background:var(--card);
          border:1px solid var(--line); border-radius:8px; color:var(--fg); }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:13px 20px; font-size:16px; font-weight:600; border:0; border-radius:8px;
           background:var(--accent); color:#1a1206; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .examples { margin:14px 0 0; color:var(--muted); font-size:14px; }
  .examples a { color:var(--accent); cursor:pointer; margin-right:12px; }
  .stats { display:flex; gap:14px; margin:32px 0 8px; }
  .stat { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .stat .v { font-size:26px; font-weight:700; }
  .stat .l { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
  .title { margin:28px 0 6px; font-size:18px; }
  .muted { color:var(--muted); }
  .pkginfo { background:var(--card); border:1px solid var(--line); border-radius:10px;
             padding:16px 18px; margin-top:8px; }
  .pkginfo .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .pkginfo .nm { font-size:18px; font-weight:600; }
  .pkginfo .sz { color:var(--muted); white-space:nowrap; }
  .pkginfo .meta { font-size:13px; margin-top:5px; }
  .tree { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:8px 4px; font:14px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .node { display:flex; justify-content:space-between; padding:3px 14px; white-space:nowrap; }
  .node .nm { overflow:hidden; text-overflow:ellipsis; }
  .node .sz { color:var(--muted); padding-left:12px; }
  .node.circular .nm { color:var(--muted); font-style:italic; }
  .node .sdist { font-size:11px; color:var(--accent); border:1px solid var(--line);
                 border-radius:4px; padding:0 5px; margin-left:6px; }
  .bar { height:4px; border-radius:3px; background:var(--accent); opacity:.55; margin:1px 14px 7px; }
  .node { padding-bottom:0; cursor:pointer; border-radius:6px; }
  .node:hover { background:#1d242e; }
  .node:hover .nm { color:var(--accent); }
  .err { color:#ff7b72; margin-top:24px; }
  .spin { color:var(--muted); margin-top:24px; }
  .home-lead { color:var(--muted); margin:34px 0 14px; font-size:14px; }
  .home-lead strong { color:var(--fg); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:7px 12px; font:13px ui-monospace,SFMono-Regular,Menlo,monospace;
          background:var(--card); border:1px solid var(--line); border-radius:999px;
          color:var(--fg); cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  footer { margin-top:48px; text-align:center; font-size:13px; }
  footer a { color:var(--muted); text-decoration:none; }
  footer a:hover { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1><a href="/">py<span class="py">size</span></a></h1>
  <p class="sub">find the install size of a PyPI package — wheel + all dependencies.</p>
  <form id="f">
    <input id="q" placeholder="e.g. requests  or  headroom-ai[all]" autocomplete="off" autofocus>
    <button id="go">Go</button>
  </form>
  <p class="examples">try:
    <a data-q="requests">requests</a>
    <a data-q="fastapi">fastapi</a>
    <a data-q="pandas">pandas</a>
    <a data-q="headroom-ai[all]">headroom-ai[all]</a>
  </p>
  <div id="out"></div>
  <footer>
    <a href="https://github.com/svandragt/pysize" target="_blank" rel="noopener">
      svandragt/pysize on GitHub
    </a>
  </footer>
</div>
<script>
const out = document.getElementById('out');
const q = document.getElementById('q');
const go = document.getElementById('go');

function fmt(bytes){
  if(bytes >= 1099511627776) return (bytes/1099511627776).toFixed(1)+' TB';
  if(bytes >= 1073741824) return (bytes/1073741824).toFixed(1)+' GB';
  if(bytes >= 1048576) return (bytes/1048576).toFixed(2)+' MB';
  if(bytes >= 1024) return (bytes/1024).toFixed(1)+' kB';
  return bytes+' B';
}

function esc(s){ return String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function age(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const days = (Date.now() - d.getTime()) / 86400000;
  if(days < 1) return 'today';
  if(days < 60) return Math.round(days)+'d ago';
  if(days < 730) return Math.round(days/30)+'mo ago';
  return Math.round(days/365)+'y ago';
}

async function render(val){
  go.disabled = true;
  out.innerHTML = '<div class="spin">resolving '+esc(val)+' …</div>';
  try {
    const r = await fetch('/api/size?pkg='+encodeURIComponent(val));
    const d = await r.json();
    if(!r.ok){ out.innerHTML = '<div class="err">'+esc(d.error||'error')+'</div>'; return; }
    const sdistBadge = (on) => on
      ? ` <span class="sdist" title="No wheel published — size is the source tarball, not the installed size">sdist</span>`
      : '';
    // Bars scale across the dependencies (the selected package is shown above,
    // not in the list), so the list reads as a comparison between deps.
    const max = Math.max(...d.packages.map(p => p.size), 1);
    const row = (p) => {
      const bits = [p.version, p.license, age(p.released)].filter(Boolean).map(esc);
      const sub = `<span class="muted">${bits.join(' · ')}</span>`;
      return `<div class="node" data-pkg="${esc(p.name)}">`
        + `<span class="nm">${esc(p.name)} ${sub}${sdistBadge(p.sdist)}</span>`
        + `<span class="sz">${fmt(p.size)}</span></div>`
        + `<div class="bar" style="width:${(p.size/max*100).toFixed(1)}%"></div>`;
    };
    const selfMeta = [d.self_license, age(d.self_released)].filter(Boolean).map(esc).join(' · ');
    const depHead = d.dep_count
      ? `<div class="title">${d.dep_count} unique ${d.dep_count === 1 ? 'dependency' : 'dependencies'} `
        + `<span class="muted">— click any to drill in</span></div>`
        + `<div class="tree">${d.packages.map(row).join('')}</div>`
      : `<div class="title muted">no dependencies</div>`;
    out.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="v">${fmt(d.total_size)}</div><div class="l">total size</div></div>
        <div class="stat"><div class="v">${fmt(d.self_size)}</div><div class="l">package only</div></div>
        <div class="stat"><div class="v">${d.dep_count}</div><div class="l">dependencies</div></div>
      </div>
      <div class="pkginfo">
        <div class="top">
          <span class="nm">${esc(d.name)} <span class="muted">${esc(d.version)}</span>${sdistBadge(d.self_sdist)}</span>
          <span class="sz">${fmt(d.self_size)}</span>
        </div>
        ${selfMeta ? `<div class="meta muted">${selfMeta}</div>` : ''}
      </div>
      ${depHead}`;
  } catch(e){
    out.innerHTML = '<div class="err">request failed: '+esc(e)+'</div>';
  } finally {
    go.disabled = false;
  }
}

// The empty home state: seed the area below the search box with PyPI's
// heaviest projects (names only — pysize's value is the size + dep count you
// get on click, not restating PyPI's storage numbers). Cached after first load.
let homeHtml = null;
async function loadHome(){
  if(homeHtml !== null){ out.innerHTML = homeHtml; return; }
  try {
    const r = await fetch('/api/top');
    const d = await r.json();
    if(!r.ok || !d.packages) return;
    const chips = d.packages.map(n => `<a class="chip" data-q="${esc(n)}">${esc(n)}</a>`).join('');
    homeHtml = `<p class="home-lead">PyPI hosts <strong>${fmt(d.total_size)}</strong> of packages — `
      + `here are some of its heaviest. Click any to see its real install size and dependency count:</p>`
      + `<div class="chips">${chips}</div>`;
    if(q.value.trim() === '') out.innerHTML = homeHtml;  // don't clobber an in-flight query
  } catch(e){ /* on failure the area just stays empty, as before */ }
}

// Run a query and push it to the URL so the result is shareable / linkable.
function go_to(val, push){
  val = (val||'').trim();
  q.value = val;
  if(!val){ loadHome(); return; }
  if(push){
    const url = '?pkg='+encodeURIComponent(val);
    if(location.search !== url) history.pushState({pkg:val}, '', url);
  }
  render(val);
}

document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); go_to(q.value, true); });
document.querySelectorAll('.examples a').forEach(a =>
  a.addEventListener('click', () => go_to(a.dataset.q, true)));
out.addEventListener('click', e => {
  const el = e.target.closest('.node, .chip');
  if(el) go_to(el.dataset.pkg || el.dataset.q, true);
});
window.addEventListener('popstate', () =>
  go_to(new URLSearchParams(location.search).get('pkg') || '', false));

// Clicking the title resets to the empty home state (no reload).
document.querySelector('h1 a').addEventListener('click', e => {
  e.preventDefault();
  history.pushState({}, '', location.pathname);
  go_to('', false);
  q.focus();
});

// On load: resolve the URL's package if present, else show the home leaderboard.
const initial = new URLSearchParams(location.search).get('pkg');
if(initial) go_to(initial, false); else loadHome();
</script>
</body>
</html>
