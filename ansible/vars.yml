---
# ── Edit these for your server ──────────────────────────────────────────────
domain: pysize.example.com               # subdomain to serve (DNS A/AAAA must already point here)
repo_url: https://github.com/youruser/pysize.git
repo_version: main                       # branch/tag/commit to deploy
certbot_email: you@example.com           # for Let's Encrypt expiry notices

# ── Sensible defaults (usually leave as-is) ─────────────────────────────────
app_user: pysize                         # dedicated system user, no login
app_root: /opt/pysize                    # code + venv live here
state_dir: /var/lib/pysize               # writable runtime data (sqlite cache)
app_host: 127.0.0.1                      # app binds localhost; nginx proxies to it
app_port: 8731
python_version: "3.12"                   # uv fetches this if absent (matches TARGET_PYTHON)
acme_webroot: /var/www/letsencrypt       # certbot http-01 challenge dir

# Per-IP rate limiting at nginx (basic abuse guard)
rate_limit: "10r/s"
rate_burst: 20
